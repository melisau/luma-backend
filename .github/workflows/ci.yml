name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: testpassword123
          SERVE_FRONTEND: "false"
          STORAGE_BACKEND: local
        run: PYTHONPATH=. pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t luma-backend:ci .

      - name: Verify Alembic files in image
        run: |
          docker run --rm luma-backend:ci test -f /app/alembic.ini
          docker run --rm luma-backend:ci test -d /app/alembic/versions

      - name: Smoke test container
        run: |
          docker run -d --name luma-api -p 18000:8000 \
            -e SECRET_KEY=ci-docker-secret \
            -e ADMIN_EMAIL=admin@test.com \
            -e ADMIN_PASSWORD=testpassword123 \
            -e SERVE_FRONTEND=false \
            luma-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs luma-api
          exit 1
