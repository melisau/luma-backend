# Luma Melisa on the shared VDS (141.11.109.174), behind the shared Caddy
# (berkdev-proxy-caddy-1). Nothing here publishes a port; the shared Caddy
# reaches melisaluma-api and melisaluma-storage over the berkdev-proxy network.
#
# Layout on the server:
#   /opt/melisaluma/.env.vds        secrets (chmod 600, never in git)
#   /opt/melisaluma/luma-backend    this repo
#   /opt/melisaluma/luma-frontend   frontend repo
#
# Deploy: /opt/melisaluma/luma-backend/deploy/vds-deploy.sh [branch]

name: melisaluma

x-env-file: &env-file
  env_file: ../../.env.vds

services:
  api:
    <<: *env-file
    container_name: melisaluma-api
    build: ..
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg2://luma:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@melisaluma-db:5432/luma
      PUBLIC_BASE_URL: https://${DOMAIN:?DOMAIN is not set}
      FRONTEND_ORIGINS: https://${DOMAIN}
      SERVE_FRONTEND: "true"
      FRONTEND_PATH: /app/frontend
      RATE_LIMIT_BACKEND: database
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://melisaluma-storage:8333
      STORAGE_PUBLIC_ENDPOINT: https://${DOMAIN}
      STORAGE_BUCKET: luma-private
      STORAGE_ACCESS_KEY_ID: luma-app
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is not set}
      STORAGE_REGION: us-east-1
    # One process, so the reminder and cleanup loops run once.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips=*
    expose: ["8000"]
    volumes:
      - ../../luma-frontend:/app/frontend:ro
    networks: [default, berkdev-proxy]
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  db:
    container_name: melisaluma-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: luma
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    container_name: melisaluma-backup
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: melisaluma-db
      PGUSER: luma
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: luma
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../../backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    networks: [default]
    depends_on:
      db:
        condition: service_healthy

  # Photo storage (S3-compatible). Only the API's key can read or write.
  storage:
    container_name: melisaluma-storage
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      APP_SECRET: ${STORAGE_SECRET_ACCESS_KEY}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /data /etc/seaweedfs
        printf '{"identities":[{"name":"luma","credentials":[{"accessKey":"luma-app","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$APP_SECRET" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -ip=melisaluma-storage -ip.bind=0.0.0.0 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    expose: ["8333"]
    volumes:
      - storagedata:/data
    networks: [default, berkdev-proxy]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30

  storage-init:
    container_name: melisaluma-storage-init
    image: chrislusf/seaweedfs:3.97
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "s3.bucket.list" | weed shell -master=melisaluma-storage:9333 | grep -qw luma-private \
          || echo "s3.bucket.create -name luma-private" | weed shell -master=melisaluma-storage:9333
        echo "storage ready"
    networks: [default]
    depends_on:
      storage:
        condition: service_healthy

volumes:
  pgdata:
  storagedata:

networks:
  berkdev-proxy:
    external: true
